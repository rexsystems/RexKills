name: RexKills
version: '${project.version}'
main: me.rexsystems.rexKills.RexKills
api-version: '1.21'
folia-supported: true
authors: [RexSystems]
description: Custom death messages for Paper servers
website: https://rexsystems.me
softdepend: [PlaceholderAPI]

commands:
  rexkills:
    description: RexKills command
    aliases: [rxk, kills]
    usage: /rexkills <help|reload|preview>

permissions:
  rexkills.reload:
    description: Reload RexKills
    default: op
  rexkills.preview:
    description: Preview a death message
    default: op
  rexkills.bypass:
    description: Keep the vanilla death message for your own deaths
    default: op
  rexkills.custom:
    description: Receive a custom death message when require-permission is on
    default: true
